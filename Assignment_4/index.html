<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mintlify Clone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <div class="container">
        <div class="logo">
          <img src="/assets/header/logo.svg" alt="Mintlify logo" />
        </div>

        <nav class="nav-links">
          <ul>
            <li>Resources</li>
            <li>Documentation</li>
            <li>Customers</li>
            <li>Blog</li>
            <li>Pricing</li>
          </ul>
        </nav>

        <div class="cta-section">
          <button class="cta-1">Contact sales</button>
          <button class="cta-2">Start for free</button>
        </div>
      </div>
    </header>

    <main>

      <section class="hero">

        <div class="container">

          <div class="new-feat">

            <div class="new">NEW</div>

            <p>Self-updating docs with agent suggestions</p>

            <div class="circle-arrow">
              >
            </div>

          </div>

          <h1>The Intelligent <br> Knowledge Platform</h1>

          <p class="description">Helping teams create and maintain world-class <br> documentation built for both humans and AI</p>

          <div class="ask-email">
            <input type="email" placeholder="Email address" size="34">
            <button>Start now</button>
          </div>

          <div class="mint-dashboard">
            <img src="/assets/section-1/hero-image-dark.svg" alt="Mintlify Dashboard">
          </div>

        </div>

      </section>
    </main>

    <footer></footer>
  </body>
</html>
